 ctx.globalAlpha=1;ctx.fillStyle='#8b9096';
 for(let i=0;i<=5;i++){const t=v0+(v1-v0)*i/5;ctx.fillText((t/1e3).toFixed(2)+' ms',X(t)-16,13)}
}
function zoom(a,b){v0=Math.max(0,a);v1=Math.min(D.span_us,b);draw()}
cv.addEventListener('wheel',e=>{e.preventDefault();const t=T(e.offsetX),k=e.deltaY>0?1.25:.8;
 v0=Math.max(0,t-(t-v0)*k);v1=Math.min(D.span_us,t+(v1-t)*k);if(v1-v0<1)v1=v0+1;draw()},{passive:false});
let drag=null;cv.onmousedown=e=>drag=[e.offsetX,v0,v1];addEventListener('mouseup',()=>drag=null);cv.ondblclick=()=>zoom(0,D.span_us);
cv.onmousemove=e=>{
 if(drag){const dt=(drag[0]-e.offsetX)/(W()-PAD-8)*(drag[2]-drag[1]);let a=drag[1]+dt,b=drag[2]+dt;
  if(a<0){b-=a;a=0}if(b>D.span_us){a-=b-D.span_us;b=D.span_us}v0=Math.max(0,a);v1=b;draw();return}
 const t=T(e.offsetX),l=Math.floor((e.offsetY-TOP)/LH);let txt=null;
 const h=D.events.filter(x=>x[2]==l&&x[0]<=t&&x[1]>=t).sort((a,b)=>(a[1]-a[0])-(b[1]-b[0]))[0];
 if(h)txt=h[4]+' · '+(h[1]-h[0]).toFixed(1)+' µs';
 else{const g=D.gaps.find(g=>g[0]<=t&&g[1]>=t);if(g)txt='GPU idle '+(g[1]-g[0]).toFixed(0)+' µs — '+g[2]}
 if(txt){tip.style.display='block';tip.style.left=Math.min(e.clientX+12,innerWidth-440)+'px';tip.style.top=e.clientY+14+'px';tip.textContent=txt}else tip.style.display='none'};
cv.onmouseleave=()=>tip.style.display='none';addEventListener('resize',size);size();
