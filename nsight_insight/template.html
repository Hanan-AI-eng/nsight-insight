<!doctype html><html lang="en"><meta charset="utf-8"><title>nsight-insight · __TITLE__</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--g:#76b900;--bg:#0e0f11;--card:#17191c;--tx:#e8e8e8;--mu:#8b9096;--bad:#ff5d5d;--warn:#ffb020}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:24px;max-width:1200px}
h1{margin:0;font-size:28px}h1 span{color:var(--g)}h3{margin:26px 0 10px}
.sub{color:var(--mu);margin:2px 0 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border-radius:10px;padding:14px 16px}
.k{font-size:26px;font-weight:700;color:var(--g)}.l{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
canvas{width:100%;display:block;cursor:grab}canvas:active{cursor:grabbing}
.hint{color:var(--mu);font-size:12px;margin-top:8px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.f{border-left:4px solid var(--mu);margin-bottom:10px}.f.bad{border-color:var(--bad)}.f.warn{border-color:var(--warn)}.f.good{border-color:var(--g)}
.f b{display:block}.f small{color:var(--mu);font-size:13px}.f .fix{color:var(--g);font-size:13px;margin-top:4px}
button{background:#25282c;color:var(--tx);border:0;border-radius:6px;padding:5px 10px;cursor:pointer;margin-top:8px;font:inherit;font-size:13px}
button:hover{background:#30343a}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;text-align:left;border-bottom:1px solid #26292d;font-size:13px;vertical-align:middle}
th{color:var(--mu);font-weight:600}.bar{height:6px;background:var(--g);border-radius:3px}
#tip{position:fixed;background:#000d;padding:6px 9px;border-radius:6px;font-size:12px;pointer-events:none;display:none;max-width:420px;word-break:break-word}
.warnbox{background:#3a2d10;color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px;display:none}
footer{color:var(--mu);font-size:12px;margin-top:30px}
</style>
<h1>nsight<span>-insight</span></h1>
<div class="sub">Why is the GPU idle? · __TITLE__</div>
<div class="warnbox" id="trunc">Trace is large: only the longest events are drawn on the timeline. Analysis uses all events.</div>
<div class="kpis" id="kpis"></div>
<div class="card"><canvas id="tl"></canvas>
<div class="hint" id="hint"></div></div>
<h3>Findings</h3><div id="fs"></div>
<div id="idle"></div>
<h3>Top kernels by GPU time</h3><div class="card"><table id="top"></table></div>
<footer>Generated by nsight-insight. Analysis is based on an Nsight Systems SQLite export.</footer>
<div id="tip"></div>
<script>
const D=__DATA__;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COL=['#76b900','#4aa3ff','#b07cff','#ffb020'],KIND=['Kernel','Memcpy','NVTX range','Blocking CUDA API'];

if(D.truncated)$('trunc').style.display='block';
$('kpis').innerHTML=[[(D.util*100).toFixed(0)+'%','GPU busy'],[D.idle_ms.toFixed(1)+' ms','GPU idle'],
 [D.n_gaps,'Idle gaps'],[D.kernels.toLocaleString(),'Kernels'],[(D.span_us/1e3).toFixed(1)+' ms','Trace length']]
 .map(([a,b])=>`<div class="card"><div class="k">${a}</div><div class="l">${b}</div></div>`).join('');
$('hint').innerHTML=COL.map((c,i)=>`<span><i class="sw" style="background:${c}"></i>${KIND[i]}</span>`).join('')+
 '<span><i class="sw" style="background:#ff5d5d66"></i>GPU idle gap</span><span>Scroll = zoom · drag = pan · double-click = reset</span>';
$('fs').innerHTML=D.findings.map(f=>`<div class="card f ${f.sev}"><b>${esc(f.title)}</b><small>${esc(f.detail)}</small>
 <div class="fix">→ ${esc(f.fix)}</div>${f.zoom?`<button onclick="zoom(${f.zoom[0]},${f.zoom[1]});scrollTo({top:0,behavior:'smooth'})">Show on timeline</button>`:''}</div>`).join('');
if(D.idle_by_range.length)$('idle').innerHTML='<h3>Where the CPU was while the GPU idled</h3><div class="card"><table><tr><th>NVTX range<th>Idle (ms)<th style="width:30%">Share of idle time</tr>'+
 D.idle_by_range.map(r=>`<tr><td>${esc(r.name)}<td>${r.ms.toFixed(2)}<td><div class="bar" style="width:${r.pct*100}%"></div></tr>`).join('')+'</table></div>';
$('top').innerHTML='<tr><th>Kernel<th>Calls<th>Time (ms)<th style="width:25%">Share</tr>'+
 D.top.map(t=>`<tr><td>${esc(t.name)}<td>${t.calls}<td>${t.ms.toFixed(2)}<td><div class="bar" style="width:${t.pct*100}%"></div></tr>`).join('');

const cv=$('tl'),ctx=cv.getContext('2d'),tip=$('tip'),LH=32,PAD=140,TOP=22;
let v0=0,v1=D.span_us;
const W=()=>cv.clientWidth,X=t=>PAD+(t-v0)/(v1-v0)*(W()-PAD-8),T=x=>v0+(x-PAD)/(W()-PAD-8)*(v1-v0);
function size(){const h=D.lanes.length*LH+TOP+8,r=devicePixelRatio||1;cv.style.height=h+'px';cv.width=W()*r;cv.height=h*r;draw()}
function draw(){
 const r=devicePixelRatio||1;ctx.setTransform(r,0,0,r,0,0);ctx.clearRect(0,0,W(),cv.height/r);ctx.font='12px system-ui';
 D.lanes.forEach((n,i)=>{ctx.fillStyle=i%2?'#ffffff05':'#ffffff0a';ctx.fillRect(PAD,TOP+i*LH,W()-PAD,LH);ctx.fillStyle='#8b9096';ctx.fillText(n,6,TOP+i*LH+20)});
 ctx.fillStyle='#ff5d5d44';
 for(const g of D.gaps){if(g[1]<v0||g[0]>v1)continue;ctx.fillRect(X(g[0]),TOP,Math.max(1,X(g[1])-X(g[0])),D.lanes.length*LH)}
 for(const e of D.events){if(e[1]<v0||e[0]>v1)continue;const x=X(e[0]),w=Math.max(1,X(e[1])-x);
  ctx.globalAlpha=e[3]==2?.55:1;ctx.fillStyle=COL[e[3]];ctx.fillRect(x,TOP+e[2]*LH+5,w,LH-10)}
 ctx.globalAlpha=1;ctx.fillStyle='#8b9096';
 for(let i=0;i<=5;i++){const t=v0+(v1-v0)*i/5;ctx.fillText((t/1e3).toFixed(2)+' ms',X(t)-16,13)}
}
function zoom(a,b){v0=Math.max(0,a);v1=Math.min(D.span_us,b);draw()}
cv.addEventListener('wheel',e=>{e.preventDefault();const t=T(e.offsetX),k=e.deltaY>0?1.25:.8;
 v0=Math.max(0,t-(t-v0)*k);v1=Math.min(D.span_us,t+(v1-t)*k);if(v1-v0<1)v1=v0+1;draw()},{passive:false});
let drag=null;cv.onmousedown=e=>drag=[e.offsetX,v0,v1];addEventListener('mouseup',()=>drag=null);cv.ondblclick=()=>zoom(0,D.span_us);
cv.onmousemove=e=>{
 if(drag){const dt=(drag[0]-e.offsetX)/(W()-PAD-8)*(drag[2]-drag[1]);let a=drag[1]+dt,b=drag[2]+dt;
  if(a<0){b-=a;a=0}if(b>D.span_us){a-=b-D.span_us;b=D.span_us}v0=Math.max(0,a);v1=b;draw();return}
 const t=T(e.offsetX),l=Math.floor((e.offsetY-TOP)/LH);let txt=null;
 const h=D.events.filter(x=>x[2]==l&&x[0]<=t&&x[1]>=t).sort((a,b)=>(a[1]-a[0])-(b[1]-b[0]))[0];
 if(h)txt=h[4]+' · '+(h[1]-h[0]).toFixed(1)+' µs';
 else{const g=D.gaps.find(g=>g[0]<=t&&g[1]>=t);if(g)txt='GPU idle '+(g[1]-g[0]).toFixed(0)+' µs — '+g[2]}
 if(txt){tip.style.display='block';tip.style.left=Math.min(e.clientX+12,innerWidth-440)+'px';tip.style.top=e.clientY+14+'px';tip.textContent=txt}else tip.style.display='none'};
cv.onmouseleave=()=>tip.style.display='none';addEventListener('resize',size);size();
</script></html>
